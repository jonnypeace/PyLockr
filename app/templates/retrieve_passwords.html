{% extends "base.html" %}
{% block head_extra %}
<link href="https://cdn.datatables.net/v/dt/dt-3.1.4/fh-5.1.2/r-4.1.1/sc-3.1.1/datatables.min.css" rel="stylesheet" integrity="sha384-FM4UuGzh3ovGBM74joqkNHiigYbrZmvYz2SD2OdANTZmKjD383fVj/BoZr53/9l9" crossorigin="anonymous">
<meta name="csrf-token" content="{{ csrf_token }}">
{% endblock %}
{% block content %}
<div id="vaultData" data-vault="{{ passwords }}" class="hidden"></div>
<div class="container-table">
    <h1>PyLockr: Passwords</h1>
    <div class="actions-new">
    <!-- Wrapper for left-aligned buttons -->
    <div class="left-buttons">
        <a href="{{ url_for('main.add_password') }}" class="button-link button-spacing">Add New Password</a>
        <a href="{{ url_for('main.dashboard') }}" class="button-link">Dashboard</a>
    </div>
    
    <!-- Right-aligned buttons -->
    <div class="right-buttons">
        <button id="selectAllBtn">Select All</button>
        <button id="deselectAllBtn">Deselect All</button>
    </div>
    </div>
    <form action="{{ url_for('main.delete_multiple_passwords') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <table id="myTable" class="display table-dark">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Category</th>
                    <th>Actions</th>
                    <th class="checkbox-header"></th>
                </tr>
            </thead>
            <tbody>
                <!-- JavaScript will dynamically insert rows here -->
            </tbody>
        </table>
        <div id="toast" class="toast">Password copied to clipboard!</div>
        <div class="delete-selected">
            <button type="submit" class="delete-confirm-btn">Delete</button>
        </div>
    </form>
</div>
<script nonce="{{ nonce }}"
   src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous">
</script>
<script nonce="{{ nonce }}"
    src="https://cdn.datatables.net/v/dt/dt-3.1.4/fh-5.1.2/r-4.1.1/sc-3.1.1/datatables.min.js" integrity="sha384-AOPrXUE7CYPquW88nUtSP5GBpMBYrNNCqsLcc2tBzHdI2My5aMRjgIvD0iPqsjsL" crossorigin="anonymous">
</script>
<script nonce="{{ nonce }}" type="module" src="{{ url_for('static', filename='scripts/clipboard.js') }}"></script>

{% endblock %}
